<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eriana Investments LLC — Surplus Funds Recovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F4EC;
    --paper-dim: #EEE9DA;
    --ink: #161F19;
    --forest: #23422F;
    --forest-soft: #2E5439;
    --gold: #B8892B;
    --gold-bright: #CE9E3C;
    --slate: #5C6B60;
    --hairline: #DAD3BF;
    --hairline-dark: rgba(247,244,236,0.16);
    --red-flag: #A34433;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--forest);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  a { color: inherit; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }

  h1, h2, h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.08;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247,244,236,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hairline);
  }

  .nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }

  .mark {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-links { display: flex; gap: 34px; list-style: none; font-size: 14px; }
  .nav-links a { text-decoration: none; color: var(--forest); position: relative; padding-bottom: 4px; }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; right: 100%; bottom: 0;
    height: 1px; background: var(--gold); transition: right 0.25s ease;
  }
  .nav-links a:hover::after { right: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    text-decoration: none; padding: 12px 22px;
    border: 1px solid var(--forest); color: var(--forest);
    background: transparent; cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .btn:hover { background: var(--forest); color: var(--paper); }

  .btn-gold { border-color: var(--gold); background: var(--gold); color: var(--paper); }
  .btn-gold:hover { background: var(--gold-bright); border-color: var(--gold-bright); }

  .nav-cta { font-size: 12px; padding: 10px 18px; }

  .hero { padding: 88px 0 80px; }

  .notice-frame {
    border: 1px solid var(--hairline);
    padding: 52px 60px 60px;
    position: relative;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 48px;
    align-items: start;
  }
